name: CI

# Läuft bei jedem Push und jedem Pull Request. Baut die App komplett
# frisch auf (MariaDB + Schema + Testdaten + PHP-Webserver) und lässt
# den Rauchtest aus bin/smoke-test.sh dagegenlaufen — fängt genau das
# Muster ab, das uns schon mehrfach passiert ist: ein falscher
# require_once-Pfad oder eine fehlende Datei führt lokal manchmal erst
# beim Klicken auf, hier fällt es sofort bei jedem Push auf.
on:
  push:
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    services:
      mariadb:
        # Prod auf all-inkl läuft auf MariaDB 10.11 (geprüft am Dump vom
        # 15.10.2026). Bei einem Versionswechsel im KAS hier mitziehen.
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: hunderassen_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          # all-inkl erlaubt PHP frei bis 8.5 wählbar — das ist die
          # Version, auf die auch produktiv gestellt wird.
          php-version: '8.5'
          extensions: pdo_mysql, mbstring, gd, fileinfo, json
          coverage: none

      - name: Auf MariaDB warten
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h127.0.0.1 -P3306 -uroot -proot && break
            echo "Warte auf MariaDB... ($i/30)"
            sleep 2
          done

      - name: Schema importieren
        run: mysql -h127.0.0.1 -P3306 -uroot -proot hunderassen_ci < sql/schema.sql

      - name: Testdaten (Fixture) importieren
        run: mysql -h127.0.0.1 -P3306 -uroot -proot hunderassen_ci < sql/fixtures/ci_seed.sql

      - name: Test-Passwörter setzen (Super-Admin in Mandant 1, Admin in Mandant B)
        run: |
          HASH=$(php -r "echo password_hash('CiTest123!', PASSWORD_DEFAULT);")
          HASH_B=$(php -r "echo password_hash('CiTestB456!', PASSWORD_DEFAULT);")
          mysql -h127.0.0.1 -P3306 -uroot -proot hunderassen_ci \
            -e "UPDATE users SET password_hash = '${HASH}', is_active = 1 WHERE username = 'admin' AND tenant_id = 1;
                UPDATE users SET password_hash = '${HASH_B}', is_active = 1 WHERE username = 'admin' AND tenant_id = 2;"

      - name: config/database.local.php erzeugen
        run: |
          cat > config/database.local.php << 'PHPEOF'
          <?php
          return [
              'host'    => '127.0.0.1',
              'name'    => 'hunderassen_ci',
              'user'    => 'root',
              'pass'    => 'root',
              'charset' => 'utf8mb4',
          ];
          PHPEOF

      - name: logs-Verzeichnis anlegen
        run: mkdir -p logs

      - name: PHP-Webserver im Hintergrund starten
        run: |
          php -S 127.0.0.1:8000 &
          echo "Warte auf PHP-Server..."
          for i in $(seq 1 15); do
            curl -s -o /dev/null http://127.0.0.1:8000/login.php && break
            sleep 1
          done

      - name: Unit-Tests (ohne Datenbank)
        run: |
          php tests/RassentextGliederungTest.php
          php tests/UebersetzungTest.php
          php tests/SprachdateienTest.php
          php tests/TheDogApiAbgleichTest.php
          php tests/RassenDatenTest.php
          php tests/RassenFilterTest.php
          php tests/MerkmalVorschlaegeTest.php
          php tests/InhaltsDateiTest.php
          php tests/TestImportTest.php
          php tests/TheDogApiBilderTest.php
          php tests/WikimediaBilderTest.php
          php tests/GroessenklasseTest.php

      - name: Rauchtest ausführen
        run: bash bin/smoke-test.sh http://127.0.0.1:8000 admin CiTest123! ci-b admin CiTestB456!

      - name: App-Fehlerlog bei Fehlschlag anzeigen
        if: failure()
        run: |
          echo "--- logs/app_errors.log ---"
          cat logs/app_errors.log 2>/dev/null || echo "(kein Log vorhanden)"

  migration:
    # Spielt die Mandanten-Migration auf dem Schema-Stand von vor der
    # Umstellung ein (Tag prod-2026-10-15), zweimal
    # hin und zweimal zurück, und vergleicht das Schema danach mit vorher.
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: hunderassen_mig
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Code auschecken (mit Historie für das alte Schema)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auf MariaDB warten
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h127.0.0.1 -P3306 -uroot -proot && break
            sleep 2
          done

      - name: Altes Schema mit Beispieldaten einspielen
        run: |
          git show prod-2026-10-15:sql/schema.sql > /tmp/schema_alt.sql
          mysql -h127.0.0.1 -uroot -proot hunderassen_mig < /tmp/schema_alt.sql
          mysql -h127.0.0.1 -uroot -proot hunderassen_mig -e "
            INSERT INTO halter (id, name, created_by) VALUES (1, 'Alt-Halter', 1);
            INSERT INTO dogs (id, name, created_by) VALUES (1, 'Alt-Hund', 1);
            INSERT INTO dog_halter (dog_id, halter_id) VALUES (1, 1);
            INSERT INTO tests (id, name, created_by) VALUES (1, 'Alt-Test', 1);"

      - name: Migration hin (2x), Schema prüfen, zurück (2x)
        run: |
          DB="mysql -h127.0.0.1 -uroot -proot hunderassen_mig"
          dump() { mysqldump -h127.0.0.1 -uroot -proot --no-data --skip-comments hunderassen_mig | sed -E 's/ AUTO_INCREMENT=[0-9]+//'; }
          dump > /tmp/vorher.sql
          $DB < sql/migrationen/migration_2026_07_10_multi_tenant.sql
          $DB < sql/migrationen/migration_2026_07_10_multi_tenant.sql
          $DB -N -e "SELECT COUNT(*) FROM users WHERE is_super_admin = 1" | grep -qx 1
          $DB -N -e "SELECT COUNT(*) FROM dogs WHERE tenant_id = 1" | grep -qx 1
          $DB -N -e "SELECT COUNT(*) FROM information_schema.STATISTICS WHERE TABLE_SCHEMA = DATABASE() AND INDEX_NAME IN ('uq_username','uq_test_name')" | grep -qx 0
          $DB < sql/migrationen/rollback_multi_tenant.sql
          $DB < sql/migrationen/rollback_multi_tenant.sql
          dump > /tmp/nachher.sql
          diff /tmp/vorher.sql /tmp/nachher.sql

      - name: "Textversionen bis Wikidata: hin (je 2x), gegen schema.sql vergleichen, zurück (je 2x)"
        # Ausgangspunkt ist das Schema vor den Textversionen (Tag
        # prod-2026-10-15-mandanten). Beide Migrationen nacheinander, dann
        # muss das Schema exakt einer Neuinstallation aus sql/schema.sql
        # entsprechen. Zwischenstand nach den Textversionen muss exakt dem
        # Live-Tag prod-2026-10-15-textversionen entsprechen. Rollbacks in
        # umgekehrter Reihenfolge führen exakt zum Ausgangsstand.
        run: |
          R="mysql -h127.0.0.1 -uroot -proot"
          $R -e "CREATE DATABASE txt_live CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; CREATE DATABASE txt_frisch CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; CREATE DATABASE txt_tag CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          dump() { mysqldump -h127.0.0.1 -uroot -proot --no-data --skip-comments "$1" | sed -E 's/ AUTO_INCREMENT=[0-9]+//'; }
          git show prod-2026-10-15-mandanten:sql/schema.sql | $R txt_live
          $R txt_live -e "INSERT INTO breeds (id, name, beschreibung) VALUES (1, 'Mit Text', 'Originaltext'), (2, 'Ohne Text', NULL);"
          dump txt_live > /tmp/txt_vorher.sql
          $R txt_live < sql/migrationen/migration_2026_10_15_text_versionen.sql
          $R txt_live < sql/migrationen/migration_2026_10_15_text_versionen.sql
          $R txt_live -N -e "SELECT COUNT(*) FROM breeds WHERE beschreibung_original <=> beschreibung" | grep -qx 2
          $R txt_live -N -e "SELECT COUNT(*) FROM content_revisions" | grep -qx 0
          git show prod-2026-10-15-textversionen:sql/schema.sql | $R txt_tag
          dump txt_live > /tmp/txt_zwischen.sql
          dump txt_tag > /tmp/txt_tag.sql
          diff /tmp/txt_zwischen.sql /tmp/txt_tag.sql
          $R txt_live < sql/migrationen/migration_2026_10_16_rassen_struktur.sql
          $R txt_live < sql/migrationen/migration_2026_10_16_rassen_struktur.sql
          $R txt_live -N -e "SELECT COUNT(*) FROM breeds WHERE gliederung = 'keine'" | grep -qx 2
          dump txt_live > /tmp/txt_struktur.sql
          $R txt_live -e "UPDATE breeds SET temperament = 'Calm, loyal' WHERE id = 1;"
          $R txt_live < sql/migrationen/migration_2026_10_17_rassen_englisch.sql
          $R txt_live < sql/migrationen/migration_2026_10_17_rassen_englisch.sql
          $R txt_live -N -e "SELECT COUNT(*) FROM breeds WHERE id = 1 AND temperament IS NULL AND temperament_en = 'Calm, loyal'" | grep -qx 1
          dump txt_live > /tmp/txt_englisch.sql
          $R txt_live < sql/migrationen/migration_2026_10_18_benutzer_sprache.sql
          $R txt_live < sql/migrationen/migration_2026_10_18_benutzer_sprache.sql
          dump txt_live > /tmp/txt_sprache.sql
          $R txt_live < sql/migrationen/migration_2026_10_19_merkmale.sql
          $R txt_live < sql/migrationen/migration_2026_10_19_merkmale.sql
          $R txt_live -N -e "SELECT COUNT(*) FROM merkmale" | grep -qx 16
          dump txt_live > /tmp/txt_merkmale.sql
          $R txt_live < sql/migrationen/migration_2026_10_20_merkmal_filter.sql
          $R txt_live < sql/migrationen/migration_2026_10_20_merkmal_filter.sql
          $R txt_live -N -e "SELECT COUNT(*) FROM merkmale WHERE filter_verknuepfung = 'oder'" | grep -qx 9
          dump txt_live > /tmp/txt_filter.sql
          $R txt_live -e "INSERT INTO tests (tenant_id, name) VALUES (1, 'Org-Test');"
          $R txt_live < sql/migrationen/migration_2026_10_21_allgemeine_tests.sql
          $R txt_live < sql/migrationen/migration_2026_10_21_allgemeine_tests.sql
          $R txt_live -N -e "SELECT scope_id FROM tests WHERE name = 'Org-Test'" | grep -qx 1
          $R txt_live -e "INSERT INTO tests (tenant_id, name) VALUES (NULL, 'Org-Test');"
          $R txt_live -N -e "SELECT COUNT(*) FROM tests WHERE scope_id = 0" | grep -qx 1
          if $R txt_live -e "INSERT INTO tests (tenant_id, name) VALUES (NULL, 'Org-Test');" 2>/dev/null; then echo "Doppelter allgemeiner Name wurde nicht verhindert"; exit 1; fi
          if $R txt_live < sql/migrationen/rollback_allgemeine_tests.sql 2>/dev/null; then echo "Rollback trotz allgemeiner Tests"; exit 1; fi
          $R txt_live -e "DELETE FROM tests WHERE tenant_id IS NULL;"
          dump txt_live > /tmp/txt_allgemein.sql
          $R txt_live < sql/migrationen/migration_2026_10_22_test_abschnitte.sql
          $R txt_live < sql/migrationen/migration_2026_10_22_test_abschnitte.sql
          $R txt_live -N -e "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'test_aufgaben' AND COLUMN_NAME = 'abschnitt'" | grep -qx 1
          dump txt_live > /tmp/txt_abschnitte.sql
          $R txt_live < sql/migrationen/migration_2026_10_23_bild_quelle.sql
          $R txt_live < sql/migrationen/migration_2026_10_23_bild_quelle.sql
          $R txt_live -N -e "SELECT COUNT(*) FROM breeds WHERE bild_quelle IS NULL" | grep -qx 2
          dump txt_live > /tmp/txt_bild_quelle.sql
          $R txt_live < sql/migrationen/migration_2026_10_24_bild_zurueckgestellt.sql
          $R txt_live < sql/migrationen/migration_2026_10_24_bild_zurueckgestellt.sql
          $R txt_live -N -e "SELECT COUNT(*) FROM breeds WHERE bild_zurueckgestellt IS NULL" | grep -qx 2
          dump txt_live > /tmp/txt_zurueckgestellt.sql
          $R txt_live < sql/migrationen/migration_2026_10_25_bildnachweis.sql
          $R txt_live < sql/migrationen/migration_2026_10_25_bildnachweis.sql
          $R txt_live -N -e "SELECT COUNT(*) FROM breeds WHERE bild_urheber IS NULL AND bild_lizenz IS NULL" | grep -qx 2
          dump txt_live > /tmp/txt_bildnachweis.sql
          $R txt_live < sql/migrationen/migration_2026_10_26_wikidata.sql
          $R txt_live < sql/migrationen/migration_2026_10_26_wikidata.sql
          $R txt_live -N -e "SELECT CHARACTER_MAXIMUM_LENGTH FROM information_schema.COLUMNS WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'breeds' AND COLUMN_NAME = 'bild_quelle'" | grep -qx 255
          dump txt_live > /tmp/txt_wikidata.sql
          $R txt_live < sql/migrationen/migration_2026_10_27_groessenklasse_berechnet.sql
          $R txt_live < sql/migrationen/migration_2026_10_27_groessenklasse_berechnet.sql
          $R txt_live -N -e "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'rasse_merkmale' AND COLUMN_NAME = 'quelle' AND COLUMN_TYPE LIKE '%berechnet%'" | grep -qx 1
          $R txt_frisch < sql/schema.sql
          dump txt_live > /tmp/txt_migriert.sql
          dump txt_frisch > /tmp/txt_frisch.sql
          diff /tmp/txt_migriert.sql /tmp/txt_frisch.sql
          $R txt_live < sql/migrationen/rollback_groessenklasse_berechnet.sql
          $R txt_live < sql/migrationen/rollback_groessenklasse_berechnet.sql
          dump txt_live > /tmp/txt_zurueck_groessenklasse.sql
          diff /tmp/txt_wikidata.sql /tmp/txt_zurueck_groessenklasse.sql
          $R txt_live < sql/migrationen/rollback_wikidata.sql
          $R txt_live < sql/migrationen/rollback_wikidata.sql
          dump txt_live > /tmp/txt_zurueck_wikidata.sql
          diff /tmp/txt_bildnachweis.sql /tmp/txt_zurueck_wikidata.sql
          $R txt_live < sql/migrationen/rollback_bildnachweis.sql
          $R txt_live < sql/migrationen/rollback_bildnachweis.sql
          dump txt_live > /tmp/txt_zurueck_bildnachweis.sql
          diff /tmp/txt_zurueckgestellt.sql /tmp/txt_zurueck_bildnachweis.sql
          $R txt_live < sql/migrationen/rollback_bild_zurueckgestellt.sql
          $R txt_live < sql/migrationen/rollback_bild_zurueckgestellt.sql
          dump txt_live > /tmp/txt_zurueck_zurueckgestellt.sql
          diff /tmp/txt_bild_quelle.sql /tmp/txt_zurueck_zurueckgestellt.sql
          $R txt_live < sql/migrationen/rollback_bild_quelle.sql
          $R txt_live < sql/migrationen/rollback_bild_quelle.sql
          dump txt_live > /tmp/txt_zurueck_bild_quelle.sql
          diff /tmp/txt_abschnitte.sql /tmp/txt_zurueck_bild_quelle.sql
          $R txt_live < sql/migrationen/rollback_test_abschnitte.sql
          $R txt_live < sql/migrationen/rollback_test_abschnitte.sql
          dump txt_live > /tmp/txt_zurueck_abschnitte.sql
          diff /tmp/txt_allgemein.sql /tmp/txt_zurueck_abschnitte.sql
          $R txt_live < sql/migrationen/rollback_allgemeine_tests.sql
          $R txt_live < sql/migrationen/rollback_allgemeine_tests.sql
          $R txt_live -e "DELETE FROM tests WHERE name = 'Org-Test';"
          dump txt_live > /tmp/txt_zurueck_allgemein.sql
          diff /tmp/txt_filter.sql /tmp/txt_zurueck_allgemein.sql
          $R txt_live < sql/migrationen/rollback_merkmal_filter.sql
          $R txt_live < sql/migrationen/rollback_merkmal_filter.sql
          dump txt_live > /tmp/txt_zurueck_filter.sql
          diff /tmp/txt_merkmale.sql /tmp/txt_zurueck_filter.sql
          $R txt_live < sql/migrationen/rollback_merkmale.sql
          $R txt_live < sql/migrationen/rollback_merkmale.sql
          dump txt_live > /tmp/txt_zurueck_merkmale.sql
          diff /tmp/txt_sprache.sql /tmp/txt_zurueck_merkmale.sql
          $R txt_live < sql/migrationen/rollback_benutzer_sprache.sql
          $R txt_live < sql/migrationen/rollback_benutzer_sprache.sql
          dump txt_live > /tmp/txt_zurueck_sprache.sql
          diff /tmp/txt_englisch.sql /tmp/txt_zurueck_sprache.sql
          $R txt_live < sql/migrationen/rollback_rassen_englisch.sql
          $R txt_live < sql/migrationen/rollback_rassen_englisch.sql
          $R txt_live -N -e "SELECT temperament FROM breeds WHERE id = 1" | grep -qx 'Calm, loyal'
          dump txt_live > /tmp/txt_zurueck0.sql
          diff /tmp/txt_struktur.sql /tmp/txt_zurueck0.sql
          $R txt_live < sql/migrationen/rollback_rassen_struktur.sql
          $R txt_live < sql/migrationen/rollback_rassen_struktur.sql
          dump txt_live > /tmp/txt_zurueck1.sql
          diff /tmp/txt_zwischen.sql /tmp/txt_zurueck1.sql
          $R txt_live < sql/migrationen/rollback_text_versionen.sql
          $R txt_live < sql/migrationen/rollback_text_versionen.sql
          dump txt_live > /tmp/txt_nachher.sql
          diff /tmp/txt_vorher.sql /tmp/txt_nachher.sql
